name: rescueproof
services:
  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS to your domain}
    ports:
      - "${WEB_HTTP_PORT:-80}:80"
      - "${WEB_HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks: [edge]
  api:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    image: rescueproof-api:local
    restart: unless-stopped
    environment: &backend-env
      DATABASE_URL: postgres://${POSTGRES_USER:-rescueproof}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-rescueproof}
      REDIS_URL: redis://redis:6379
      REDIS_NAMESPACE: rescueproof
      BIND_ADDRESS: 0.0.0.0:3000
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY: "true"
      RUST_LOG: ${RUST_LOG:-rescueproof=info,tower_http=info}
      ANCHOR_RELAYER_URL: ${ANCHOR_RELAYER_URL:-}
      ANCHOR_RELAYER_TOKEN: ${ANCHOR_RELAYER_TOKEN:-}
      ANCHOR_CHAIN_ID: ${ANCHOR_CHAIN_ID:-}
      ANCHOR_CONTRACT_ADDRESS: ${ANCHOR_CONTRACT_ADDRESS:-}
      ANCHOR_RPC_URL: ${ANCHOR_RPC_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [edge, data]
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:3000/health/ready]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: &logs
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  worker:
    image: rescueproof-api:local
    command: [worker]
    restart: unless-stopped
    environment: *backend-env
    depends_on:
      api:
        condition: service_healthy
    networks: [edge, data]
    logging: *logs
  relayer:
    profiles: [anchor]
    build:
      context: ./relayer
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8080
      RELAYER_TOKEN: ${ANCHOR_RELAYER_TOKEN:-}
      RELAYER_PRIVATE_KEY: ${RELAYER_PRIVATE_KEY:-}
      CHAIN_ID: ${ANCHOR_CHAIN_ID:-}
      CONTRACT_ADDRESS: ${ANCHOR_CONTRACT_ADDRESS:-}
      RPC_URL: ${ANCHOR_RPC_URL:-}
      STATE_FILE: /data/relayer-state.json
    volumes: [relayer_data:/data]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [edge, data]
    logging: *logs
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rescueproof}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-rescueproof}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logs
  redis:
    image: redis:7-alpine
    command: [redis-server, --maxmemory, 128mb, --maxmemory-policy, allkeys-lru, --save, ""]
    restart: unless-stopped
    networks: [data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logs
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  relayer_data:
networks:
  edge:
  data:
    internal: true
