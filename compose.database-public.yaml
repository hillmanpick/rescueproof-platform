services:
  postgres:
    networks: [data, edge]
    ports:
      - "${POSTGRES_PUBLIC_PORT:-5678}:5432"
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=50
      - -c
      - ssl=on
      - -c
      - ssl_min_protocol_version=TLSv1.2
      - -c
      - ssl_cert_file=/etc/postgresql/tls/server.crt
      - -c
      - ssl_key_file=/etc/postgresql/tls/server.key
      - -c
      - hba_file=/etc/postgresql/pg_hba.public.conf
    volumes:
      - ./work/postgres-tls:/etc/postgresql/tls:ro
      - ./deploy/pg_hba.public.conf:/etc/postgresql/pg_hba.public.conf:ro
