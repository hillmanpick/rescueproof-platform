# Administrative commands inside the container use its local Unix socket.
local all all trust
# Every TCP connection requires encryption and SCRAM authentication.
hostnossl all all 0.0.0.0/0 reject
hostnossl all all ::/0 reject
hostssl rescueproof rescueproof 0.0.0.0/0 scram-sha-256
hostssl rescueproof rescueproof ::/0 scram-sha-256
host all all 0.0.0.0/0 reject
host all all ::/0 reject
